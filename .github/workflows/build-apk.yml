name: Build SmsRelay APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'docs/**', '**.md' ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools + platform 36)
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -sSL --max-time 180 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate signing keystore (CI 临时，仅供出包)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias smsrelay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SmsRelay,OU=Dev,O=Lazy"

      - name: Write local.properties for signing
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "RELEASE_STORE_FILE=release.keystore" >> local.properties
          echo "RELEASE_STORE_PASSWORD=android" >> local.properties
          echo "RELEASE_KEY_ALIAS=smsrelay" >> local.properties
          echo "RELEASE_KEY_PASSWORD=android" >> local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsRelay-release-apk
          path: app/build/outputs/apk/release/app-release.apk
