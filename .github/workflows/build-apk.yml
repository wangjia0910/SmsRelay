name: Build SmsRelay APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'docs/**', '**.md' ]

# 需要 contents: write 以便失败时把诊断日志提交回仓库、成功时创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools + platform 36)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL --max-time 180 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate signing keystore (CI 临时，仅供出包)
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias smsrelay \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SmsRelay,OU=Dev,O=Lazy"

      - name: Write local.properties for signing
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "RELEASE_STORE_FILE=release.keystore" >> local.properties
          echo "RELEASE_STORE_PASSWORD=android" >> local.properties
          echo "RELEASE_KEY_ALIAS=smsrelay" >> local.properties
          echo "RELEASE_KEY_PASSWORD=android" >> local.properties

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify APK produced
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            echo "---- apk output tree ----"
            ls -laR app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          echo "APK produced: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmsRelay-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (per-run, sandbox-verifiable)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          TAG="ci-build-${{ github.run_id }}"
          gh release delete "$TAG" --yes || true
          git push --delete origin "$TAG" || true
          gh release create "$TAG" "$APK" \
            --title "CI Build #${{ github.run_id }}" \
            --notes "Automated SmsRelay release APK from workflow run ${{ github.run_id }}."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Capture build error (diagnostic -> committed & API-readable)
        if: failure()
        run: |
          mkdir -p ci-diag
          {
            echo "run_id=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-diag/meta.txt
          tail -c 30000 build.log > ci-diag/error.log
          git config user.email "ci@users.noreply.github.com"
          git config user.name "ci-bot"
          git add ci-diag/
          git commit -m "ci: capture build error [skip ci]" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wangjia0910/SmsRelay.git" HEAD:master || true
